
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>N.O.E.L. Camera Test</title>
<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #080e18;
  font-family: -apple-system, sans-serif;
}

#camera {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: 1;
  background: #080e18;
}

#controls {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 25px 18px;
  pointer-events: none;
}

#controls > * {
  pointer-events: auto;
}

button {
  display: block;
  width: 100%;
  padding: 16px;
  margin: 5px 0;
  border: 0;
  border-radius: 8px;
  background: #5ce0c7;
  color: #07141b;
  font-weight: 800;
  font-size: 14px;
}

#message {
  padding: 14px;
  border-radius: 8px;
  background: #081321e8;
  color: white;
  font-size: 13px;
}

#bottom {
  background: #081321e8;
  padding: 12px;
  border-radius: 8px;
}
</style>
</head>
<body>

<video id="camera" autoplay muted playsinline></video>

<div id="controls">

  <div>
    <div id="message">CAMERA TEST — NOT STARTED</div>
    <button id="start">START CAMERA</button>
  </div>

  <div id="bottom">
    <button id="test">TEST BUTTON</button>
    <button id="stop">STOP CAMERA</button>
  </div>

</div>

<script>
const video = document.getElementById("camera");
const message = document.getElementById("message");

document.getElementById("start").addEventListener("click", async () => {
  try {
    message.textContent = "REQUESTING CAMERA...";

    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment" },
      audio: false
    });

    video.srcObject = stream;
    await video.play();

    message.textContent =
      "CAMERA RUNNING: " +
      video.videoWidth + " × " + video.videoHeight;

  } catch (error) {
    message.textContent = "ERROR: " + error.message;
  }
});

document.getElementById("test").addEventListener("click", () => {
  message.textContent = "SUCCESS! BUTTONS ARE WORKING.";
});

document.getElementById("stop").addEventListener("click", () => {
  if (video.srcObject) {
    video.srcObject.getTracks().forEach(track => track.stop());
    video.srcObject = null;
  }

  message.textContent = "CAMERA STOPPED.";
});
</script>

</body>
</html>
